[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diff-locomotion"
version = "0.1.0"
description = "Aligned differentiable locomotion for Unitree Go1 and G1"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mjlab==1.2.0",
  "mujoco==3.5.0",
  "mujoco-warp==3.5.0",
  "warp-lang==1.12.0",
  "torch==2.8.0",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "onnxruntime>=1.20,<2",
  "onnx==1.23.2",
  "imageio==2.38.1",
  "imageio-ffmpeg==0.6.0",
  "pillow==13.0.0",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src" = ["assets/**/*"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
